<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private P2P Portal</title>
  <!-- 100% Free PeerJS Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    #video-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #localVideo {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 120px;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: #111;
      transform: scaleX(-1);
    }
    #status {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="video-container">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div id="status">Initializing camera...</div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');

    // Permanent room IDs for Person A and Person B
    const HOST_ID = "our-portal-unique-host-99";
    const GUEST_ID = "our-portal-unique-guest-99";

    let localStream;

    async function start() {
      try {
        // Request Camera & Mic
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: true
        });
        localVideo.srcObject = localStream;
        statusEl.innerText = "Camera active. Connecting...";

        // Try to become the HOST first using Google's free public STUN servers
        const peer = new Peer(HOST_ID, {
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' }
            ]
          }
        });

        peer.on('open', () => {
          statusEl.innerText = "Room created. Waiting for partner...";
        });

        // Answer incoming call from partner
        peer.on('call', (call) => {
          call.answer(localStream);
          call.on('stream', (remoteStream) => {
            remoteVideo.srcObject = remoteStream;
            statusEl.innerText = "Connected";
            setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
          });
        });

        // If HOST_ID is taken, become GUEST and call the HOST
        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            connectAsGuest();
          } else {
            console.error(err);
            statusEl.innerText = "Connection error. Retrying...";
          }
        });

      } catch (err) {
        console.error(err);
        statusEl.innerText = "Please allow Camera & Microphone permissions.";
      }
    }

    function connectAsGuest() {
      const guestPeer = new Peer(GUEST_ID, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      guestPeer.on('open', () => {
        statusEl.innerText = "Connecting to partner...";
        const call = guestPeer.call(HOST_ID, localStream);
        
        call.on('stream', (remoteStream) => {
          remoteVideo.srcObject = remoteStream;
          statusEl.innerText = "Connected";
          setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
        });
      });
    }

    start();
  </script>
</body>
</html>
