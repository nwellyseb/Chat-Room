<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Portal</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #video-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: none;
    }
    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #localVideo {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 120px;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: #111;
      transform: scaleX(-1);
    }
    #status {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      pointer-events: none;
      z-index: 100;
    }
    #start-btn {
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>

  <button id="start-btn">Start Private Call</button>

  <div id="video-container">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div id="status">Connecting...</div>
  </div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const videoContainer = document.getElementById('video-container');
    const statusEl = document.getElementById('status');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');

    const HOST_ID = "our-portal-unique-host-2026";
    const GUEST_ID = "our-portal-unique-guest-2026";

    let localStream;

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      videoContainer.style.display = 'block';

      try {
        // Request Mobile Media Access
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: true
        });
        
        localVideo.srcObject = localStream;
        localVideo.play();
        statusEl.innerText = "Camera active. Connecting room...";

        initPeer();
      } catch (err) {
        console.error(err);
        statusEl.innerText = "Error: Allow Camera & Mic in browser settings!";
      }
    });

    function initPeer() {
      const peer = new Peer(HOST_ID, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', () => {
        statusEl.innerText = "Room open. Waiting for partner...";
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        call.on('stream', (remoteStream) => {
          remoteVideo.srcObject = remoteStream;
          remoteVideo.play();
          statusEl.innerText = "Connected";
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          connectAsGuest();
        } else {
          statusEl.innerText = "Connection error. Retrying...";
        }
      });
    }

    function connectAsGuest() {
      const guestPeer = new Peer(GUEST_ID, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      guestPeer.on('open', () => {
        statusEl.innerText = "Connecting to partner...";
        const call = guestPeer.call(HOST_ID, localStream);
        
        call.on('stream', (remoteStream) => {
          remoteVideo.srcObject = remoteStream;
          remoteVideo.play();
          statusEl.innerText = "Connected";
        });
      });
    }
  </script>
</body>
</html>
