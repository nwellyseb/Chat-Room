<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Private Portal</title>
  <script src="https://unpkg.com/@daily-co/daily-js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1f22;
      color: #f2f3f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    #call-container {
      width: 95%;
      max-width: 1100px;
      height: 80vh;
      border-radius: 12px;
      overflow: hidden;
      background: #2b2d31;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>

  <div id="call-container"></div>

  <script>
    // ⚠️ REPLACE THIS WITH YOUR DAILY.CO ROOM URL
    const ROOM_URL = "https://yourname.daily.co/our-private-room";

    // Initialize video frame inside container
    const callFrame = window.DailyIframe.createFrame(
      document.getElementById('call-container'),
      {
        showLeaveButton: false,
        showFullscreenButton: true,
        iframeStyle: {
          width: '100%',
          height: '100%',
          border: 'none',
          borderRadius: '12px'
        }
      }
    );

    // Join room automatically on load
    callFrame.join({ url: ROOM_URL });
  </script>
</body>
</html>
