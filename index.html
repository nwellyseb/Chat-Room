<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Portal</title>
  <!-- Load Jitsi External API Script -->
  <script src="https://meet.jit.si/external_api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1f22;
      color: #f2f3f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .header {
      margin-bottom: 12px;
      padding: 8px 18px;
      background: #2b2d31;
      border-radius: 20px;
      font-size: 14px;
      color: #dbdee1;
      text-align: center;
    }
    #meet-container {
      width: 90%;
      max-width: 1000px;
      height: 75vh;
      border-radius: 12px;
      overflow: hidden;
      background: #2b2d31;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    iframe {
      border: none !important;
    }
  </style>
</head>
<body>

  <div class="header">🔒 Private Room Connected</div>

  <!-- Video Call Portal Container -->
  <div id="meet-container"></div>

  <script>
    // HARDCODED PRIVATE ROOM - Both devices will land here automatically
    const ROOM_NAME = "OurPrivatePortalRoom2026_SecureKey99";

    const domain = "meet.jit.si";
    const options = {
      roomName: ROOM_NAME,
      parentNode: document.querySelector('#meet-container'),
      width: '100%',
      height: '100%',
      configOverwrite: {
        startWithAudioMuted: false,
        startWithVideoMuted: false,
        disableDeepLinking: true, // Prevents prompting to download the mobile app
        prejoinPageEnabled: false, // Skips pre-join screen, enters room instantly
        toolbarButtons: [
          'microphone', 'camera', 'desktop', 'fullscreen',
          'hangup', 'tileview', 'chat'
        ]
      },
      interfaceConfigOverwrite: {
        SHOW_JITSI_WATERMARK: false,
        SHOW_WATERMARK_FOR_GUESTS: false,
        DEFAULT_BACKGROUND: '#1e1f22',
        TOOLBAR_ALWAYS_VISIBLE: false
      }
    };

    // Initialize the video portal
    const api = new JitsiMeetExternalAPI(domain, options);
  </script>
</body>
</html>
