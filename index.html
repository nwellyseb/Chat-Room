<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Room</title>
  <!-- Load Daily.co Iframe API -->
  <script src="https://unpkg.com/@daily-co/daily-js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #call-container {
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

  <div id="call-container"></div>

  <script>
    // REPLACE THIS WITH YOUR DAILY ROOM URL FROM YOUR DASHBOARD
    const DAILY_ROOM_URL = "https://yourdomain.daily.co/your-room-name";

    const callFrame = window.DailyIframe.createFrame(
      document.getElementById('call-container'),
      {
        showLeaveButton: true,
        iframeStyle: {
          width: '100%',
          height: '100%',
          border: '0'
        }
      }
    );

    callFrame.join({ url: DAILY_ROOM_URL });
  </script>
</body>
</html>
