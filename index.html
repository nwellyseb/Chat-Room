<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Room</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1f22;
      color: #f2f3f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .status-bar {
      margin-bottom: 16px;
      padding: 10px 20px;
      background: #2b2d31;
      border-radius: 20px;
      font-size: 14px;
      color: #dbdee1;
      text-align: center;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      width: 90%;
      max-width: 1000px;
    }
    .video-card {
      position: relative;
      background: #2b2d31;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .label {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }
    button {
      background: #5865f2;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #4752c4; }
  </style>
</head>
<body>

  <div id="status" class="status-bar">Setting up camera...</div>

  <div class="video-grid">
    <div class="video-card">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="label">You</div>
    </div>
    <div class="video-card">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="label" id="partnerLabel">Partner (Offline)</div>
    </div>
  </div>

  <div class="controls">
    <button onclick="copyRoomLink()">📋 Copy Invite Link</button>
  </div>

  <script>
    // 1. Ensure a shared room name exists in the URL
    const urlParams = new URLSearchParams(window.location.search);
    let roomName = urlParams.get('room');

    if (!roomName) {
      roomName = 'secret-' + Math.random().toString(36).substring(2, 9);
      window.history.replaceState({}, '', `?room=${roomName}`);
    }

    const statusEl = document.getElementById('status');
    let localStream;
    let peer;
    let callInterval;

    // 2. Start Camera first
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(stream => {
        localStream = stream;
        document.getElementById('localVideo').srcObject = stream;
        setupPeer();
      })
      .catch(err => {
        statusEl.innerText = "Please allow camera and microphone access.";
      });

    function setupPeer() {
      // Create a unique Peer ID for THIS specific browser session
      const myId = `${roomName}-${Math.random().toString(36).substring(2, 7)}`;
      peer = new Peer(myId);

      peer.on('open', id => {
        statusEl.innerText = "Waiting for partner... Share the link!";
        startCallingPartner();
      });

      // Answer incoming call from partner
      peer.on('call', call => {
        call.answer(localStream);
        handleCall(call);
      });

      peer.on('error', err => console.error(err));
    }

    function startCallingPartner() {
      // Constantly check if partner is online every 2 seconds until connected
      callInterval = setInterval(() => {
        // Query PeerJS server for active peers in this room
        peer.listAllPeers(peers => {
          const partnerPeerId = peers.find(id => id.startsWith(roomName) && id !== peer.id);
          
          if (partnerPeerId) {
            clearInterval(callInterval); // Stop probing once partner is found
            statusEl.innerText = "Connecting to partner...";
            const call = peer.call(partnerPeerId, localStream);
            handleCall(call);
          }
        });
      }, 2000);
    }

    function handleCall(call) {
      call.on('stream', remoteStream => {
        if (callInterval) clearInterval(callInterval);
        statusEl.innerText = "Connected!";
        document.getElementById('partnerLabel').innerText = "Partner";
        document.getElementById('remoteVideo').srcObject = remoteStream;
      });

      call.on('close', () => {
        statusEl.innerText = "Partner disconnected. Waiting...";
        document.getElementById('partnerLabel').innerText = "Partner (Offline)";
        document.getElementById('remoteVideo').srcObject = null;
        startCallingPartner(); // Resume looking for partner if they drop
      });
    }

    function copyRoomLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("Room link copied! Send this link to your partner.");
    }
  </script>
</body>
</html>
