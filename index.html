<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Private Room</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1f22;
      color: #f2f3f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .status {
      margin-bottom: 16px;
      padding: 8px 16px;
      background: #2b2d31;
      border-radius: 20px;
      font-size: 14px;
      color: #949ba4;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      width: 90%;
      max-width: 1000px;
    }
    .video-card {
      position: relative;
      background: #2b2d31;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .label {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="status" class="status">Connecting to room...</div>

  <div class="video-grid">
    <div class="video-card">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="label">You</div>
    </div>
    <div class="video-card">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="label">Partner</div>
    </div>
  </div>

  <script>
    // 1. Get room name from URL, or default to a unique secret room
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'our-private-room-987654';

    const statusEl = document.getElementById('status');
    let localStream;
    let peer;

    // 2. Get local camera and microphone stream
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(stream => {
        localStream = stream;
        document.getElementById('localVideo').srcObject = stream;
        connectToRoom();
      })
      .catch(err => {
        statusEl.innerText = 'Camera/Microphone access denied.';
        console.error(err);
      });

    function connectToRoom() {
      // Host ID will always be the room name
      const hostId = `host-${roomId}`;
      
      // Try registering as the Guest first
      peer = new Peer();

      peer.on('open', () => {
        statusEl.innerText = 'Looking for partner...';
        
        // Try calling the Host
        const call = peer.call(hostId, localStream);

        let connected = false;

        call.on('stream', remoteStream => {
          connected = true;
          statusEl.innerText = 'Connected!';
          document.getElementById('remoteVideo').srcObject = remoteStream;
        });

        // If Host isn't there yet, assume the Host role
        setTimeout(() => {
          if (!connected) {
            call.close();
            peer.destroy();
            becomeHost(hostId);
          }
        }, 2000);
      });
    }

    function becomeHost(hostId) {
      statusEl.innerText = 'Waiting for partner to join...';
      
      // Register with the fixed Host ID
      peer = new Peer(hostId);

      peer.on('call', call => {
        statusEl.innerText = 'Partner joined!';
        call.answer(localStream);
        call.on('stream', remoteStream => {
          document.getElementById('remoteVideo').srcObject = remoteStream;
        });
      });

      peer.on('error', err => {
        if (err.type === 'unavailable-id') {
          // If ID is taken, try connecting as guest again
          setTimeout(connectToRoom, 1000);
        }
      });
    }
  </script>
</body>
</html>
