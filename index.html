<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Private Room</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1f22;
      color: #f2f3f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .status-bar {
      margin-bottom: 16px;
      padding: 10px 20px;
      background: #2b2d31;
      border-radius: 20px;
      font-size: 14px;
      color: #dbdee1;
      text-align: center;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      width: 90%;
      max-width: 1000px;
    }
    .video-card {
      position: relative;
      background: #2b2d31;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .label {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }
    button {
      background: #5865f2;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #4752c4; }
  </style>
</head>
<body>

  <div id="status" class="status-bar">Accessing camera...</div>

  <div class="video-grid">
    <div class="video-card">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="label">You</div>
    </div>
    <div class="video-card">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="label" id="partnerLabel">Partner (Offline)</div>
    </div>
  </div>

  <div class="controls">
    <button onclick="copyRoomLink()">📋 Copy Invite Link</button>
  </div>

  <script>
    // 1. Get room name from URL, or create a unique secret one
    const urlParams = new URLSearchParams(window.location.search);
    let roomName = urlParams.get('room');

    if (!roomName) {
      roomName = 'our-secret-room-' + Math.floor(100000 + Math.random() * 900000);
      window.history.replaceState({}, '', `?room=${roomName}`);
    }

    const hostId = `${roomName}-host`;
    const guestId = `${roomName}-guest`;
    const statusEl = document.getElementById('status');
    
    let localStream;
    let peer;

    // 2. WebRTC Configuration using Metered.ca Open-Relay STUN/TURN Servers
    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          {
            urls: 'turn:openrelay.metered.ca:80',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          },
          {
            urls: 'turn:openrelay.metered.ca:443',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          },
          {
            urls: 'turn:openrelay.metered.ca:443?transport=tcp',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          }
        ]
      }
    };

    // 3. Request camera/microphone permissions
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(stream => {
        localStream = stream;
        document.getElementById('localVideo').srcObject = stream;
        tryHost();
      })
      .catch(err => {
        statusEl.innerText = "Please grant camera and microphone access.";
        console.error(err);
      });

    // Device 1: Attempt to register as Host
    function tryHost() {
      peer = new Peer(hostId, peerConfig);

      peer.on('open', () => {
        statusEl.innerText = "Waiting for partner... Share the link!";
        peer.on('call', call => {
          call.answer(localStream);
          handleStream(call);
        });
      });

      // If Host slot is taken, Device 2 registers as Guest
      peer.on('error', err => {
        if (err.type === 'unavailable-id') {
          tryGuest();
        } else {
          console.error("Peer error:", err);
        }
      });
    }

    // Device 2: Register as Guest and call the Host
    function tryGuest() {
      peer = new Peer(guestId, peerConfig);

      peer.on('open', () => {
        statusEl.innerText = "Partner found! Connecting video...";
        
        peer.on('call', call => {
          call.answer(localStream);
          handleStream(call);
        });

        // Dial the host
        const call = peer.call(hostId, localStream);
        if (call) {
          handleStream(call);
        }
      });

      peer.on('error', err => {
        console.error("Guest error:", err);
      });
    }

    // Handle connected video streams
    function handleStream(call) {
      call.on('stream', remoteStream => {
        statusEl.innerText = "Connected!";
        document.getElementById('partnerLabel').innerText = "Partner";
        document.getElementById('remoteVideo').srcObject = remoteStream;
      });

      call.on('close', () => {
        statusEl.innerText = "Partner disconnected.";
        document.getElementById('partnerLabel').innerText = "Partner (Offline)";
        document.getElementById('remoteVideo').srcObject = null;
      });

      call.on('error', err => {
        console.error("Call error:", err);
      });
    }

    function copyRoomLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("Room link copied to clipboard! Send this link to your partner.");
    }
  </script>
</body>
</html>
