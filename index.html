<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Room</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1f22;
      color: #f2f3f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .status-bar {
      margin-bottom: 16px;
      padding: 10px 20px;
      background: #2b2d31;
      border-radius: 20px;
      font-size: 14px;
      color: #dbdee1;
      text-align: center;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 1000px;
    }
    .video-card {
      position: relative;
      background: #2b2d31;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .label {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #5865f2;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary { background: #4e5058; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div id="status" class="status-bar">Initializing camera...</div>

  <div class="video-grid">
    <div class="video-card">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="label">You</div>
    </div>
    <div class="video-card">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="label" id="partnerLabel">Partner (Offline)</div>
    </div>
  </div>

  <div class="controls">
    <button onclick="copyRoomLink()">📋 Copy Link</button>
    <button class="secondary" onclick="newRoom()">🔄 Create New Room</button>
  </div>

  <!-- Trystero via MQTT -->
  <script type="module">
    import { joinRoom } from 'https://cdn.jsdelivr.net/npm/trystero@0.22.0/mqtt.min.js';

    const statusEl = document.getElementById('status');
    const partnerLabel = document.getElementById('partnerLabel');
    const remoteVideo = document.getElementById('remoteVideo');
    let localStream;
    let room;

    // Parse or generate room code
    const urlParams = new URLSearchParams(window.location.search);
    let roomCode = urlParams.get('room');

    if (!roomCode) {
      roomCode = 'room-' + Math.random().toString(36).substring(2, 8);
      window.history.replaceState({}, '', `?room=${roomCode}`);
    }

    // WebRTC & TURN Relay configuration
    const config = {
      appId: 'private-portal-app-v2',
      rtcConfig: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          {
            urls: 'turn:openrelay.metered.ca:80',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          },
          {
            urls: 'turn:openrelay.metered.ca:443',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          }
        ]
      }
    };

    async function init() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        statusEl.innerText = "Waiting for partner... Send her the link!";

        connectRoom();
      } catch (err) {
        statusEl.innerText = "⚠️ Camera access blocked. Allow permissions and refresh.";
        console.error(err);
      }
    }

    function connectRoom() {
      room = joinRoom(config, roomCode);

      room.onPeerJoin(peerId => {
        statusEl.innerText = "Partner detected! Connecting...";
        room.addStream(localStream, peerId);
      });

      room.onPeerStream((remoteStream, peerId) => {
        statusEl.innerText = "🟢 Connected!";
        partnerLabel.innerText = "Partner";
        remoteVideo.srcObject = remoteStream;
      });

      room.onPeerLeave(peerId => {
        statusEl.innerText = "Partner disconnected. Waiting for re-connect...";
        partnerLabel.innerText = "Partner (Offline)";
        remoteVideo.srcObject = null;
      });
    }

    window.copyRoomLink = function() {
      navigator.clipboard.writeText(window.location.href);
      alert("Link copied! Send it to your partner.");
    };

    window.newRoom = function() {
      const newCode = 'room-' + Math.random().toString(36).substring(2, 8);
      window.location.search = `?room=${newCode}`;
    };

    init();
  </script>
</body>
</html>
