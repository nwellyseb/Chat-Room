<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Room</title>
  <!-- Load Jitsi External API -->
  <script src="https://meet.jit.si/external_api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #meet {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="meet"></div>

  <script>
    // 1. Single shared secret room key embedded directly in the site
    // Visiting the same link lands both of you in this exact space
    const SHARED_ROOM_ID = "OurPrivatePortalRoom2026_SecureSyncKey99";

    // 2. Generate a random session ID so the server treats each device as a distinct user
    const uniqueUserId = "user_" + Math.random().toString(36).substring(2, 9);

    const domain = "meet.jit.si";
    const options = {
      roomName: SHARED_ROOM_ID,
      width: '100%',
      height: '100%',
      parentNode: document.querySelector('#meet'),
      userInfo: {
        displayName: 'User_' + Math.floor(Math.random() * 100)
      },
      configOverwrite: {
        startWithAudioMuted: false,
        startWithVideoMuted: false,
        prejoinPageEnabled: false, // Bypasses pre-join setup, enters call directly
        disableDeepLinking: true,   // Prevents mobile prompt to install app
        enableWelcomePage: false
      },
      interfaceConfigOverwrite: {
        SHOW_JITSI_WATERMARK: false,
        SHOW_WATERMARK_FOR_GUESTS: false,
        DEFAULT_BACKGROUND: '#121212',
        TOOLBAR_BUTTONS: [
          'microphone', 'camera', 'desktop', 'fullscreen',
          'hangup', 'tileview', 'chat'
        ]
      }
    };

    // Initialize call on load
    const api = new JitsiMeetExternalAPI(domain, options);
  </script>
</body>
</html>
