<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Portal</title>
  <!-- Official 8x8 Jitsi Web SDK -->
  <script src="https://8x8.vc/v1/static/external_api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #meet {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="meet"></div>

  <script>
    // 1. Get room name from URL or use a default static room name
    const urlParams = new URLSearchParams(window.location.search);
    let roomName = urlParams.get('room');

    // Default room ID if no ?room= parameter is provided
    if (!roomName) {
      roomName = "OurPrivatePortalRoom2026_Secure99";
    }

    // 2. Initialize 8x8/Jitsi API
    const domain = "8x8.vc";
    const options = {
      roomName: `vpaas-magic-cookie-8x8/${roomName}`,
      width: '100%',
      height: '100%',
      parentNode: document.querySelector('#meet'),
      configOverwrite: {
        startWithAudioMuted: false,
        startWithVideoMuted: false,
        prejoinPageEnabled: false, // Bypasses pre-join screen for instant connection
        disableDeepLinking: true   // Stops phone from forcing app store download
      },
      interfaceConfigOverwrite: {
        TOOLBAR_BUTTONS: [
          'microphone', 'camera', 'desktop', 'fullscreen',
          'hangup', 'tileview', 'chat', 'raisehand'
        ],
        SHOW_JITSI_WATERMARK: false
      }
    };

    const api = new JitsiMeetExternalAPI(domain, options);
  </script>
</body>
</html>
